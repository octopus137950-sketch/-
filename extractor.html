<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 Audio Extractor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/coi-serviceworker/0.1.7/coi-serviceworker.min.js"></script>
    <script src="./ffmpeg.min.js" onerror="alert('ไม่พบไฟล์ ffmpeg.min.js')"></script>
    <style>
        :root { --bg-color: #0b0b0c; --card-color: #16161a; --text-color: #ffffff; --accent-color: #39ff14; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 450px; background-color: var(--card-color); padding: 24px; border-radius: 14px; border: 1px solid #2c2c2e; box-sizing: border-box; }
        h2 { margin-top: 0; font-size: 20px; border-bottom: 2px solid var(--accent-color); padding-bottom: 8px; margin-bottom: 24px; }
        input[type="file"] { width: 100%; background: #2c2c2e; padding: 12px; border-radius: 8px; color: #fff; border: 1px dashed #48484a; box-sizing: border-box; margin-bottom: 20px; }
        .btn { width: 100%; background-color: #fff; color: #000; border: none; padding: 16px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-back { background: transparent; color: var(--accent-color); border: 1px solid var(--accent-color); margin-top: 12px; padding: 10px; font-size: 14px; }
        #status { background: #2c2c2e; padding: 12px; border-radius: 8px; text-align: center; margin: 20px 0; color: var(--accent-color); }
        .audio-result { background: #1c1c1e; padding: 16px; border-radius: 8px; margin-top: 20px; text-align: center; }
        audio { width: 100%; margin-top: 10px; }
        .dl-link { display: inline-block; background: var(--accent-color); color: #000; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎵 MP3 Audio Extractor</h2>
        <input type="file" id="video-input" accept="video/*">
        <button class="btn" onclick="extractAudio()">สกัดและแปลงเป็นไฟล์ MP3</button>
        <div id="status">สถานะ: รอสั่งงาน</div>
        <div id="result-area"></div>
        <button class="btn btn-back" onclick="location.href='index.html'">⬅️ กลับหน้าหลัก</button>
    </div>

    <script>
        let ffmpeg = null;
        window.addEventListener('DOMContentLoaded', async () => {
            if (typeof FFmpeg !== 'undefined') {
                ffmpeg = FFmpeg.createFFmpeg({ log: true });
            }
        });

        async function extractAudio() {
            const input = document.getElementById('video-input').files[0];
            if (!input) { alert('กรุณาเลือกไฟล์วิดีโอก่อนครับ'); return; }
            const status = document.getElementById('status');
            status.innerText = "กำลังดูดเสียงออกจากวิดีโอ...";

            try {
                if (!ffmpeg.isLoaded()) await ffmpeg.load();
                ffmpeg.FS('writeFile', 'input.mp4', await FFmpeg.fetchFile(input));
                
                // สั่งดึงเฉพาะ Audio stream ออกมาแปลงรหัสเป็น MP3 Bitrate 192k 
                await ffmpeg.run('-i', 'input.mp4', '-vn', '-acodec', 'libmp3lame', '-ab', '192k', 'output.mp3');
                
                const data = ffmpeg.FS('readFile', 'output.mp3');
                const blob = new Blob([data.buffer], { type: 'audio/mp3' });
                const url = URL.createObjectURL(blob);

                status.innerText = "✨ สกัดไฟล์เสียงสำเร็จ!";
                document.getElementById('result-area').innerHTML = `
                    <div class="audio-result">
                        <strong>🎧 ฟังเสียงที่ได้:</strong><br>
                        <audio src="${url}" controls></audio><br>
                        <a href="${url}" download="extracted_audio.mp3" class="dl-link">💾 ดาวน์โหลดไฟล์ MP3</a>
                    </div>`;
            } catch (e) {
                status.innerText = "❌ เกิดข้อผิดพลาดในการแปลงไฟล์";
                console.error(e);
            }
        }
    </script>
</body>
</html>
