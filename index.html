<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Video Splitter Pro</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/coi-serviceworker/0.1.7/coi-serviceworker.min.js"></script>
    
    <script src="./ffmpeg.min.js" onerror="handleScriptError()"></script>

    <style>
        /* 🎨 แต่งหน้าเว็บสไตล์ Modern Streetwear (Dark Mode / Neon Green Accent) */
        :root {
            --bg-color: #0b0b0c;
            --card-color: #16161a;
            --text-color: #ffffff;
            --text-muted: #8e8e93;
            --accent-color: #39ff14; /* เขียวนีออน */
            --blue-color: #007aff;
            --error-color: #ff3b30;
            --border-radius: 14px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background-color: var(--card-color);
            padding: 24px;
            border-radius: var(--border-radius);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            border: 1px solid #2c2c2e;
        }

        h2 {
            margin-top: 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px;
            margin-bottom: 24px;
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="file"] {
            width: 100%;
            background: #2c2c2e;
            padding: 12px;
            border-radius: 8px;
            color: var(--text-color);
            border: 1px dashed #48484a;
            box-sizing: border-box;
            font-size: 14px;
        }

        /* 🆕 จัดระเบียบกล่องกรอกเวลาแยกเป็น 3 ช่องพร้อมป้ายกำกับด้านใน */
        .time-splitter-group {
            display: flex;
            gap: 8px;
        }

        .time-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #2c2c2e;
            border: 1px solid #48484a;
            border-radius: 8px;
            padding: 6px;
        }

        .time-box span {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .time-box input[type="number"] {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            padding: 4px 0;
            outline: none;
        }

        /* เมื่อกดโฟกัสที่ช่องกรอก ให้ขอบกล่องนอกเปลี่ยนสี */
        .time-box:focus-within {
            border-color: var(--accent-color);
        }

        .btn-primary {
            width: 100%;
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        .btn-primary:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        #status {
            background-color: #2c2c2e;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            margin: 20px 0;
            color: var(--accent-color);
            border-left: 4px solid var(--accent-color);
        }

        .progress-container {
            width: 100%;
            background-color: #2c2c2e;
            border-radius: 20px;
            margin: 15px 0;
            display: none;
            overflow: hidden;
            border: 1px solid #48484a;
        }

        .progress-bar {
            width: 0%;
            height: 18px;
            background-color: var(--blue-color);
            text-align: center;
            line-height: 18px;
            color: white;
            font-size: 11px;
            font-weight: 700;
            transition: width 0.1s linear;
        }

        .video-bar { 
            background-color: var(--accent-color); 
            color: #000000;
        }
        
        .error-bar { 
            background-color: var(--error-color) !important; 
            color: white;
        }

        #output-list {
            margin-top: 25px;
        }

        #output-list h3 {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .clip-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
            background: #1c1c1e;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid #2c2c2e;
        }

        .clip-title {
            flex-grow: 1;
            font-size: 14px;
            font-weight: 600;
            padding-left: 8px;
        }

        .action-btn {
            background-color: #2c2c2e;
            color: var(--text-color);
            border: 1px solid #48484a;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-btn:active {
            background-color: #3a3a3c;
            border-color: var(--accent-color);
        }

        .share-btn {
            background-color: var(--blue-color);
            border-color: var(--blue-color);
        }
        
        .share-btn:active {
            background-color: #0051d4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>CLIP SPLITTER PRO</h2>
        
        <div class="form-group">
            <label>เลือกไฟล์วิดีโอกจากมือถือ</label>
            <input type="file" id="video-input" accept="video/*">
        </div>
        
        <div class="form-group">
            <label>ตั้งค่าความยาวคลิปย่อยที่ต้องการหั่น</label>
            <div class="time-splitter-group">
                <div class="time-box">
                    <span>ชั่วโมง</span>
                    <input type="number" id="input-hours" value="0" min="0">
                </div>
                <div class="time-box">
                    <span>นาที</span>
                    <input type="number" id="input-minutes" value="1" min="0" max="59">
                </div>
                <div class="time-box">
                    <span>วินาที</span>
                    <input type="number" id="input-seconds" value="30" min="0" max="59">
                </div>
            </div>
        </div>
        
        <button class="btn-primary" onclick="processVideo()">เริ่มหั่นวิดีโอ</button>

        <div id="status">สถานะ: รอสั่งงาน</div>

        <div id="system-progress-container" class="progress-container">
            <div style="padding: 6px 12px; font-size: 11px; color: var(--text-muted);">SYSTEM BOOTING:</div>
            <div id="system-progress-bar" class="progress-bar">0%</div>
        </div>

        <div id="video-progress-container" class="progress-container">
            <div style="padding: 6px 12px; font-size: 11px; color: var(--text-muted);">SPLITTING VIDEO CPU:</div>
            <div id="video-progress-bar" class="progress-bar video-bar">0%</div>
        </div>

        <div id="output-list"></div>
    </div>

    <script>
        function handleScriptError() {
            alert("❌ ไม่พบไฟล์ ffmpeg.min.js ในโฟลเดอร์ของคุณ! กรุณาเช็กชื่อไฟล์อีกครั้ง");
            document.getElementById('status').innerText = "ข้อผิดพลาด: หาไฟล์สคริปต์ไม่เจอ";
        }

        let ffmpeg = null;
        
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof FFmpeg === 'undefined') {
                document.getElementById('status').innerText = "รอระบบความปลอดภัยเซ็ตอัพสักครู่...";
            } else {
                const { createFFmpeg } = FFmpeg;
                ffmpeg = createFFmpeg({ log: true });
                document.getElementById('status').innerText = "สถานะ: ระบบพร้อมทำงาน";
            }
        });

        async function processVideo() {
            const statusDiv = document.getElementById('status');
            const systemBar = document.getElementById('system-progress-bar');
            const videoBar = document.getElementById('video-progress-bar');
            const videoFile = document.getElementById('video-input').files[0];
            
            // 🆕 ดึงค่าจากทั้ง 3 ช่องกรอกเวลามาคำนวณ
            const hrs = parseInt(document.getElementById('input-hours').value) || 0;
            const mins = parseInt(document.getElementById('input-minutes').value) || 0;
            const secs = parseInt(document.getElementById('input-seconds').value) || 0;

            if (!videoFile) {
                alert('กรุณาเลือกไฟล์วิดีโอก่อนครับ');
                return;
            }

            // 🆕 แปลงเวลาทั้งหมดให้กลายเป็น "วินาทีรวม"
            const totalDurationInSeconds = (hrs * 3600) + (mins * 60) + secs;

            if (totalDurationInSeconds <= 0) {
                alert('❌ กรุณาตั้งค่าความยาววิดีโอให้มากกว่า 0 วินาทีครับ');
                return;
            }

            if (!ffmpeg && typeof FFmpeg !== 'undefined') {
                const { createFFmpeg } = FFmpeg;
                ffmpeg = createFFmpeg({ log: true });
            }

            if (typeof FFmpeg === 'undefined' || !ffmpeg) {
                alert('❌ ระบบกำลังเซ็ตอัพเกราะความปลอดภัยอยู่ชั่วคราว ให้รอ 3 วินาทีแล้วกดใหม่อีกครั้งครับ');
                return;
            }

            document.getElementById('output-list').innerHTML = '';
            systemBar.classList.remove('error-bar');
            systemBar.style.width = '0%';
            systemBar.innerText = '0%';
            document.getElementById('system-progress-container').style.display = 'block';
            document.getElementById('video-progress-container').style.display = 'none';
            
            statusDiv.innerText = "กำลังปลดล็อกเกาะป้องกันเบราว์เซอร์...";

            let sysProgress = 0;
            const sysInterval = setInterval(() => {
                if (sysProgress < 90) {
                    sysProgress += 5;
                    systemBar.style.width = sysProgress + '%';
                    systemBar.innerText = sysProgress + '%';
                }
            }, 40);

            try {
                ffmpeg.setProgress(({ ratio }) => {
                    if (ratio >= 0 && ratio <= 1) {
                        const percentage = Math.round(ratio * 100);
                        videoBar.style.width = percentage + '%';
                        videoBar.innerText = percentage + '%';
                    }
                });

                if (!ffmpeg.isLoaded()) {
                    await ffmpeg.load();
                }
                
                clearInterval(sysInterval);
                systemBar.style.width = '100%';
                systemBar.innerText = '100%';
                statusDiv.innerText = "โหลดโมดูลสำเร็จ นำวิดีโอเข้าแรมเสมือน...";

                const { fetchFile } = FFmpeg;
                ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(videoFile));

                videoBar.style.width = '0%';
                videoBar.innerText = '0%';
                document.getElementById('video-progress-container').style.display = 'block';
                statusDiv.innerText = "กำลังสับคลิปวิดีโอด้วยความเร็วสูง...";

                // ใช้ค่าตัวแปรวินาทีรวมที่คำนวณมาจากทั้ง 3 ช่องกรอก
                await ffmpeg.run(
                    '-i', 'input.mp4',
                    '-c', 'copy',
                    '-map', '0',
                    '-segment_time', String(totalDurationInSeconds),
                    '-f', 'segment',
                    '-reset_timestamps', '1',
                    'output_%d.mp4'
                );

                statusDiv.innerText = "⚡ สับไฟล์เสร็จสิ้น!";
                videoBar.style.width = '100%';
                videoBar.innerText = '100%';
                
                generateDownloadButtons();

            } catch (error) {
                clearInterval(sysInterval);
                systemBar.classList.add('error-bar');
                systemBar.innerText = "ล้มเหลว";
                statusDiv.innerText = "❌ ระบบรักษาความปลอดภัยปฏิเสธการเข้าถึง";
                console.error(error);
            }
        }

        function generateDownloadButtons() {
            const outputList = document.getElementById('output-list');
            outputList.innerHTML = '<h3>คลิปย่อยที่หั่นสำเร็จ:</h3>';

            let i = 0;
            while (true) {
                try {
                    const fileName = `output_${i}.mp4`;
                    const data = ffmpeg.FS('readFile', fileName);
                    
                    const videoBlob = new Blob([data.buffer], { type: 'video/mp4' });
                    const url = URL.createObjectURL(videoBlob);
                    const currentClipIndex = i + 1;

                    const videoFile = new File([videoBlob], `clip_${currentClipIndex}.mp4`, { type: 'video/mp4' });

                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'clip-row';

                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'clip-title';
                    titleDiv.innerText = `ท่อนที่ ${currentClipIndex}`;
                    rowDiv.appendChild(titleDiv);

                    const dlBtn = document.createElement('button');
                    dlBtn.className = 'action-btn';
                    dlBtn.innerText = '💾';
                    dlBtn.title = 'ดาวน์โหลดลงเครื่อง';
                    dlBtn.onclick = () => {
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `split_clip_${currentClipIndex}.mp4`;
                        a.click();
                    };
                    rowDiv.appendChild(dlBtn);

                    const shareBtn = document.createElement('button');
                    shareBtn.className = 'action-btn share-btn';
                    shareBtn.innerText = '📤 แชร์';
                    shareBtn.onclick = async () => {
                        if (navigator.canShare && navigator.canShare({ files: [videoFile] })) {
                            try {
                                await navigator.share({
                                    files: [videoFile],
                                    title: `ส่งออกคลิปท่อนที่ ${currentClipIndex}`,
                                    text: 'หั่นคลิปเสร็จแล้ว เตรียมพร้อมโพสต์โซเชียล!'
                                });
                            } catch (err) {
                                console.log('ผู้ใช้ยกเลิกการแชร์', err);
                            }
                        } else {
                            alert('❌ มือถือหรือเบราว์เซอร์ของคุณไม่รองรับระบบแชร์ไฟล์ตรงๆ แนะนำให้กดปุ่มดาวน์โหลด (💾) แทนครับ');
                        }
                    };
                    rowDiv.appendChild(shareBtn);

                    outputList.appendChild(rowDiv);
                    i++;
                } catch (e) {
                    break;
                }
            }
            
            if(i === 0) {
                outputList.innerHTML += '<p style="color:var(--error-color); font-size:14px; text-align:center;">ไม่พบไฟล์วิดีโอผลลัพธ์</p>';
            }
        }
    </script>
</body>
</html>
