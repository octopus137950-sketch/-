<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Video Studio Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root { --bg: #0b0b0c; --card: #16161a; --accent: #39ff14; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; padding: 20px; }
        .studio-container { max-width: 800px; margin: auto; }
        
        #preview { width: 100%; height: 300px; background: #000; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        
        #timeline { background: var(--card); padding: 15px; border-radius: 10px; min-height: 100px; }
        .clip-item { background: #2c2c2e; padding: 10px; margin-bottom: 5px; border-radius: 5px; cursor: grab; display: flex; justify-content: space-between; }
        
        .controls { margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="studio-container">
        <h1>Video Studio Pro</h1>
        <div id="preview"><video id="videoPlayer" controls style="width:100%"></video></div>

        <input type="file" id="fileInput" multiple accept="video/*" onchange="addClips()">
        
        <h3>Timeline (ลากสลับลำดับได้)</h3>
        <div id="timeline"></div>

        <div class="controls">
            <button onclick="renderAll()" style="background:var(--accent); padding:15px 30px; border:none; border-radius:8px;">Export ผลงาน</button>
        </div>
    </div>

    <script>
        const timeline = document.getElementById('timeline');
        new Sortable(timeline, { animation: 150 });

        function addClips() {
            const files = document.getElementById('fileInput').files;
            timeline.innerHTML = '';
            for(let file of files) {
                const div = document.createElement('div');
                div.className = 'clip-item';
                div.innerHTML = `<span>${file.name}</span> <small>หั่นแบบแมนนวลได้</small>`;
                timeline.appendChild(div);
            }
        }

        async function renderAll() {
            alert("ระบบกำลัง Render คลิปตามลำดับใน Timeline...");
        }
    </script>
</body>
</html>
