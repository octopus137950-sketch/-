<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video to GIF Maker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/coi-serviceworker/0.1.7/coi-serviceworker.min.js"></script>
    <script src="./ffmpeg.min.js" onerror="alert('ไม่พบไฟล์ ffmpeg.min.js')"></script>
    <style>
        :root { --bg-color: #0b0b0c; --card-color: #16161a; --text-color: #ffffff; --accent-color: #39ff14; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 450px; background-color: var(--card-color); padding: 24px; border-radius: 14px; border: 1px solid #2c2c2e; box-sizing: border-box; }
        h2 { margin-top: 0; font-size: 20px; border-bottom: 2px solid var(--accent-color); padding-bottom: 8px; margin-bottom: 24px; }
        input[type="file"], input[type="number"] { width: 100%; background: #2c2c2e; padding: 12px; border-radius: 8px; color: #fff; border: 1px solid #48484a; box-sizing: border-box; margin-bottom: 15px; }
        .row { display: flex; gap: 10px; }
        .col { flex: 1; }
        label { font-size: 12px; color: #8e8e93; display: block; margin-bottom: 4px; }
        .btn { width: 100%; background-color: #fff; color: #000; border: none; padding: 16px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-back { background: transparent; color: var(--accent-color); border: 1px solid var(--accent-color); margin-top: 12px; padding: 10px; font-size: 14px; }
        #status { background: #2c2c2e; padding: 12px; border-radius: 8px; text-align: center; margin: 20px 0; color: var(--accent-color); }
        .gif-result { background: #1c1c1e; padding: 16px; border-radius: 8px; margin-top: 20px; text-align: center; }
        img { width: 100%; max-height: 250px; border-radius: 6px; object-fit: contain; }
        .dl-link { display: inline-block; background: var(--accent-color); color: #000; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🖼️ Video to GIF Maker</h2>
        <input type="file" id="video-input" accept="video/*">
        
        <div class="row">
            <div class="col">
                <label>เริ่มต้นที่วินาทีที่</label>
                <input type="number" id="start-sec" value="0" min="0">
            </div>
            <div class="col">
                <label>ความยาวภาพ GIF (วิ)</label>
                <input type="number" id="duration-sec" value="3" min="1">
            </div>
        </div>

        <button class="btn" onclick="makeGif()">แปลงเป็นรูป GIF ดุ๊กดิ๊ก</button>
        <div id="status">สถานะ: รอสั่งงาน</div>
        <div id="result-area"></div>
        <button class="btn btn-back" onclick="location.href='index.html'">⬅️ กลับหน้าหลัก</button>
    </div>

    <script>
        let ffmpeg = null;
        window.addEventListener('DOMContentLoaded', async () => {
            if (typeof FFmpeg !== 'undefined') {
                ffmpeg = FFmpeg.createFFmpeg({ log: true });
            }
        });

        async function makeGif() {
            const input = document.getElementById('video-input').files[0];
            const start = document.getElementById('start-sec').value || 0;
            const duration = document.getElementById('duration-sec').value || 3;
            
            if (!input) { alert('กรุณาเลือกไฟล์วิดีโอก่อนครับ'); return; }
            const status = document.getElementById('status');
            status.innerText = "กำลังปั่นเฟรมรูปภาพสร้าง GIF...";

            try {
                if (!ffmpeg.isLoaded()) await ffmpeg.load();
                ffmpeg.FS('writeFile', 'input.mp4', await FFmpeg.fetchFile(input));
                
                // สั่งตัดวิดีโอตามช่วง และบีบขนาดสเกลความกว้างเหลือ 320px เพื่อให้ไฟล์ GIF ไม่ใหญ่เกินไป เฟรมเรต 10fps
                await ffmpeg.run('-ss', String(start), '-t', String(duration), '-i', 'input.mp4', '-vf', 'fps=10,scale=320:-1:flags=lanczos', 'output.gif');
                
                const data = ffmpeg.FS('readFile', 'output.gif');
                const blob = new Blob([data.buffer], { type: 'image/gif' });
                const url = URL.createObjectURL(blob);

                status.innerText = "✨ แปลงเป็นภาพ GIF เรียบร้อย!";
                document.getElementById('result-area').innerHTML = `
                    <div class="gif-result">
                        <strong>🎉 พรีวิวผลลัพธ์:</strong><br><br>
                        <img src="${url}"><br>
                        <a href="${url}" download="animation.gif" class="dl-link">💾 ดาวน์โหลดรูป GIF</a>
                    </div>`;
            } catch (e) {
                status.innerText = "❌ เกิดข้อผิดพลาด";
                console.error(e);
            }
        }
    </script>
</body>
</html>
